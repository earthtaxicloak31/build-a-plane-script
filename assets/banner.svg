<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="50%" stop-color="#101b30"/>
      <stop offset="100%" stop-color="#0a1420"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skyLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0"/>
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1200" height="360" fill="url(#glow)"/>

  <!-- Decorative flight lines -->
  <path d="M -50 80 L 400 40" stroke="url(#skyLine)" stroke-width="2" opacity="0.5"/>
  <path d="M 800 60 L 1250 100" stroke="url(#skyLine)" stroke-width="2" opacity="0.5"/>
  <path d="M -30 300 L 350 260" stroke="#60a5fa" stroke-width="1.5" opacity="0.15"/>
  <path d="M 850 300 L 1240 330" stroke="#60a5fa" stroke-width="1.5" opacity="0.15"/>

  <!-- Soft circles like clouds/orbits -->
  <circle cx="150" cy="90" r="60" fill="#60a5fa" opacity="0.06"/>
  <circle cx="1080" cy="270" r="90" fill="#3b82f6" opacity="0.07"/>
  <circle cx="1000" cy="80" r="40" fill="#93c5fd" opacity="0.08"/>
  <circle cx="120" cy="290" r="45" fill="#93c5fd" opacity="0.06"/>

  <!-- Minimal plane silhouette (low opacity, top area, not over text) -->
  <g opacity="0.12" fill="#e2e8f0">
    <path d="M 950 55
             L 1010 40
             L 1020 48
             L 985 62
             L 1035 58
             L 1045 66
             L 985 75
             L 960 70
             Z"/>
  </g>

  <g opacity="0.10" fill="#e2e8f0">
    <path d="M 190 45
             L 240 33
             L 248 40
             L 220 50
             L 258 48
             L 266 55
             L 218 62
             L 200 58
             Z"/>
  </g>

  <!-- Headline -->
  <text x="600" y="165" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="62.0" font-weight="700" fill="#ffffff">
    <tspan x="600" dy="0">Build Plane Script</tspan>
  </text>

  <!-- Tagline -->
  <text x="600" y="225" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="21.0" fill="#c9d1d9">
    <tspan x="600" dy="0">Build A Plane script for Roblox players — auto-collect parts and skip</tspan>
    <tspan x="600" dy="30">repetitive crafting steps.</tspan>
  </text>

  <!-- Bottom accent line -->
  <line x1="450" y1="290" x2="750" y2="290" stroke="#3b82f6" stroke-width="2" opacity="0.3"/>
</svg>